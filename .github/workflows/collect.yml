name: collect

on:
  schedule:
    - cron: "*/15 * * * *"   # toutes les 15 minutes (GitHub peut decaler de quelques minutes)
  workflow_dispatch: {}       # bouton "Run workflow" pour lancer a la main

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collecte
        run: python collector.py

      - name: Sauvegarde des donnees
        run: |
          git config user.name "collector-bot"
          git config user.email "collector-bot@users.noreply.github.com"
          git add data || true
          if git diff --cached --quiet; then
            echo "Rien de nouveau"
          else
            git commit -m "data $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
